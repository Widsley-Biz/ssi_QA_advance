# 正規ドメイン以外(Cloud Runの生URL等)でアクセスされた場合は常に正規ドメインへ
# リダイレクトする。authDomainがskillcheck.widsley.site固定のため、
# 生URL上でsignInWithRedirectするとgetRedirectResultが永久にnullを返し
# ログインできなくなるため(ブラウザのサードパーティストレージ分離)。
server {
    listen 8080;
    server_name _;
    return 301 https://skillcheck.widsley.site$request_uri;
}

server {
    listen 8080;
    server_name skillcheck.widsley.site;
    root /usr/share/nginx/html;
    index index.html;

    # Firebase Auth の signInWithPopup がwindow.close()できるようにする
    # (デフォルトのCOOPだとポップアップ⇔親ウィンドウ間の通信がブロックされる)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # authDomainをアプリ自身のドメイン(skillcheck.widsley.site)にするため、
    # Firebase Hostingの予約パス(/__/auth/, /__/firebase/)を
    # widsley-skillcheck.firebaseapp.com へそのまま中継する。
    # これが無いと、ブラウザのサードパーティストレージ分離により
    # signInWithRedirect後のgetRedirectResultが常にnullを返しログインできない
    resolver 8.8.8.8 valid=300s;
    location ^~ /__/auth/ {
        resolver 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_ssl_name widsley-skillcheck.firebaseapp.com;
        proxy_set_header Host widsley-skillcheck.firebaseapp.com;
        proxy_pass https://widsley-skillcheck.firebaseapp.com;
    }
    location ^~ /__/firebase/ {
        resolver 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_ssl_name widsley-skillcheck.firebaseapp.com;
        proxy_set_header Host widsley-skillcheck.firebaseapp.com;
        proxy_pass https://widsley-skillcheck.firebaseapp.com;
    }

    # SPA: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
